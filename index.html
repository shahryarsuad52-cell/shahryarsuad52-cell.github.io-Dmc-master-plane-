<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name-="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun & Learn Vibe Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #ffd700;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            font-size: 16px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #ff6b81;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: none;
            text-align: left;
        }
        .result-box h3 {
            color: #00ffcc;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .result-box p {
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .fact-text {
            color: #fffa65;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔥 Ultimate Vibe & Science Checker 🔥</h2>
        
        <div class="input-group">
            <label>আপনার নাম:</label>
            <input type="text" id="name1" placeholder="এখানে নাম লিখুন...">
        </div>
        
        <div class="input-group">
            <label>বন্ধুর / ক্রাশের নাম:</label>
            <input type="text" id="name2" placeholder="তার নাম লিখুন...">
        </div>
        
        <button onclick="calculateVibe()">ম্যাজিক দেখুন ✨</button>
        
        <div class="result-box" id="resultBox">
            <h3 id="resTitle"></h3>
            <p id="resComment"></p>
            <p><strong>🧠 শিক্ষণীয় ফান ফ্যাক্ট:</strong> <span class="fact-text" id="resFact"></span></p>
        </div>
    </div>

    <script>
        const funnyComments = [
            "তোদের বন্ধুত্ব দেখে মার্ক জাকারবার্গও কান্নাকাটি করছে! পাক্কা ফ্রেন্ডশিপ গোলস। 🐒",
            "বিপদের সময় এই বন্ধু সবার আগে হাওয়া হয়ে যাবে, সাবধান! 🏃‍♂️💨",
            "সারাদিন শুধু পড়ালেখার নাম করে আড্ডা আর ফুচকা খাওয়ার পারফেক্ট জুটি! ☕",
            "তোদের ব্রেন সেলগুলো প্রায় একই রকম অলস! দারুণ ম্যাচিং। 😂",
            "পৃথিবী উল্টে গেলেও তোদের এই জগাখিচুড়ি বন্ধুত্ব ভাঙবে না!"
        ];

        const scienceFacts = [
            "মানব মস্তিষ্কের প্রায় ৬০% চর্বি দিয়ে তৈরি, যা একে শরীরের সবচেয়ে চর্বিযুক্ত অঙ্গ বানায়!",
            "আলোর গতি প্রতি সেকেন্ডে প্রায় ৩ লক্ষ কিলোমিটার, যা দিয়ে পৃথিবী সেকেন্ডে ৭ বার ঘুরে ফেলা সম্ভব।",
            "পানির একটি অণুতে দুটি হাইড্রোজেন এবং একটি অক্সিজেন পরমাণু থাকে ($H_2O$)।",
            "আমাদের শরীরের রক্তনালীগুলোর মোট দৈর্ঘ্য প্রায় ১ লক্ষ কিলোমিটার, যা দিয়ে পুরো পৃথিবীকে আড়াই বার পেঁচানো যাবে!",
            "মহাবিশ্বের মোট পদার্থের মাত্র ৫% আমরা দেখতে পাই, বাকি ৯৫% হলো ডার্ক ম্যাটার এবং ডার্ক এনার্জি।"
        ];

        function calculateVibe() {
            const n1 = document.getElementById('name1').value.trim();
            const n2 = document.getElementById('name2').value.trim();
            
            if(n1 === "" || n2 === "") {
                alert("দয়া করে উভয় নামই লিখুন!");
                return;
            }

            // রেন্ডম স্কোর এবং টেক্সট সিলেক্ট করা
            const score = Math.floor(Math.random() * 41) + 60; // ৬০% থেকে ১০০% এর মধ্যে
            const randomComment = funnyComments[Math.floor(Math.random() * funnyComments.length)];
            const randomFact = scienceFacts[Math.floor(Math.random() * scienceFacts.length)];

            // রেজাল্ট বক্সে ডেটা বসানো
            document.getElementById('resTitle').innerText = `${n1} & ${n2} (ম্যাচিং স্কোর: ${score}%)`;
            document.getElementById('resComment').innerText = randomComment;
            document.getElementById('resFact').innerText = randomFact;

            // রেজাল্ট বক্স শো করা
            document.getElementById('resultBox').style.display = "block";
        }
    </script>

</body>
</html>
