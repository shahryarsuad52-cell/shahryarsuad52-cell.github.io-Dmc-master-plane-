<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Pookie Crush Finder ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pookie-pink: #ffb7c5;
            --soft-pink: #ffe4e9;
            --barbie-dark: #ff69b4;
            --white: #ffffff;
        }

        body {
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 5px solid var(--white);
            position: relative;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--barbie-dark);
            font-size: 35px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--pookie-pink);
            border-radius: 25px;
            background: white;
            outline: none;
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
        }

        button {
            background: var(--barbie-dark);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3);
        }

        button:hover {
            transform: scale(1.05);
            background: #ff1493;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 600;
            color: #d81b60;
            display: none;
        }

        /* Decorative sparkles */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffeb3b;
            border-radius: 50%;
            animation: twinkle 1.5s infinite;
        }

        @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>💖 Pookie Vibes 💖</h1>
        <p>তোমার মনের মানুষটি কে?</p>
        <input type="text" id="userName" placeholder="তোমার নাম লেখো... ✨">
        <button onclick="findCrush()">Reveal Secret ✨</button>
        <div id="result"></div>
    </div>

    <script>
        function findCrush() {
            const name = document.getElementById('userName').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!name) {
                alert("আগে নিজের নাম তো লেখো, পুকি! 🎀");
                return;
            }

            const boys = ["রাহাত", "আয়ান", "আরিয়ান", "ফাহিম", "সিয়াম", "সাদ"];
            const girls = ["মাইশা", "ঐশী", "সারা", "দিয়া", "তানিশা", "মেহজাবিন"];
            
            let crushName = "";
            const lowerName = name.toLowerCase();

            // Special logic for Maisha/Oishi
            if (lowerName.includes("মাইশা") || lowerName.includes("ঐশী")) {
                crushName = "রাহাত";
            } else {
                // Random logic
                const isBoy = Math.random() > 0.5;
                if (isBoy) {
                    crushName = girls[Math.floor(Math.random() * girls.length)];
                } else {
                    crushName = boys[Math.floor(Math.random() * boys.length)];
                }
            }

            resultDiv.style.display = "block";
            resultDiv.innerHTML = `✨ ${name}, তোমার ক্রাশ হলো <span style="font-size: 28px;">${crushName}</span>! 🎀`;
        }
    </script>
</body>
</html>
